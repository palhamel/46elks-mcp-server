name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run security scan weekly on Monday at 9:00 UTC
    - cron: '0 9 * * 1'

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      # Blocking gate: fail the build on high/critical advisories (OWASP MCP04)
      - name: Audit (blocking, high and above)
        run: npm audit --audit-level=high

      # Informational: moderate findings are reported but do not fail the build
      - name: Run npm audit (informational, moderate)
        run: npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Check for known vulnerabilities
        run: |
          npm audit --json > audit-report.json || true
          if [ -s audit-report.json ]; then
            echo "Security vulnerabilities found. Review audit-report.json"
            cat audit-report.json
          fi
      
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-audit-report
          path: audit-report.json
          retention-days: 30
